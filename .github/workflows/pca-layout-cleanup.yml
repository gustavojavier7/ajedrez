name: Cleanup PCA desktop metrics layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pca-layout-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cleanup layout CSS
        run: python tools/pca_layout_cleanup.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pca-layout-cleanup.yml tools/pca_layout_cleanup.py
          git add index.html
          git commit -m "Fix PCA layout responsive CSS cleanup"
          git push origin HEAD:main
