name: Apply PCA pulse realtime fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pca-pulse-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          def rep(old, new, n=1, label='replacement'):
              global s
              found = s.count(old)
              if found != n:
                  raise SystemExit(f'{label}: expected {n} occurrence(s), found {found}')
              s = s.replace(old, new, n)

          # 1) Correct cumulative temporal labels.
          rep(
              '<th>K</th><th>W@K</th><th>D@K</th><th>L@K</th><th>W=K</th><th>D=K</th>\n                                        <th>L=K</th><th>FRONTIER</th>',
              '<th>K</th><th>W@K</th><th>D@K</th><th>L@K</th><th>W≤K</th><th>D≤K</th>\n                                        <th>L≤K</th><th>FRONTIER</th>',
              label='temporal labels'
          )

          # 2) Persist selected temporal move across PROGRESS snapshots.
          rep(
              "        let activePcaStatus = 'RUNNING';\n",
              "        let activePcaStatus = 'RUNNING';\n        let selectedPulseMoveUci = null;\n",
              label='selected move state'
          )

          rep(
              "        function pcaCanForceMate(game, attackerColor, remainingPlies, context) {\n            context.nodes += 1;\n            if (context.nodes > context.nodeGuard) {\n                const err = new Error('PCA_NODE_GUARD');\n                err.code = 'PCA_NODE_GUARD';\n                throw err;\n            }\n",
              "        function pcaCanForceMate(game, attackerColor, remainingPlies, context) {\n            context.nodes += 1;\n            if (context.nodes > context.nodeGuard) {\n                const err = new Error('PCA_NODE_GUARD');\n                err.code = 'PCA_NODE_GUARD';\n                throw err;\n            }\n            if (context.reportProgress) context.reportProgress(false);\n",
              label='mate recursive progress hook'
          )

          # 3) Keep the historical pure function as wrapper, add an instrumentable core.
          rep(
              "        function pcaAnalyzePosition(fen, kGuard) {\n            const guard = Number(kGuard);\n            const trace = [];\n",
              "        function pcaAnalyzePositionCore(fen, kGuard, options = {}) {\n            const guard = Number(kGuard);\n            const trace = [];\n            const onProgress = typeof options.onProgress === 'function' ? options.onProgress : null;\n",
              label='mate core signature'
          )

          rep(
              "            const context = { nodes: 0, nodeGuard: PCA_NODE_GUARD, memo: new Map() };\n\n            try {\n                for (const k of horizons) {\n                    const winningMoves = [];\n\n                    for (const move of rootMoves) {\n                        if (pcaRootMoveForcesMate(fen, move, rootColor, k, context)) {\n                            winningMoves.push(move);\n                        }\n                    }\n",
              "            const context = {\n                nodes: 0,\n                nodeGuard: PCA_NODE_GUARD,\n                memo: new Map(),\n                activeDepth: 0,\n                activeMove: null,\n                activeMoveIndex: -1,\n                activeMoveStartNodes: 0,\n                lastReportedNodes: 0,\n                lastReportedAt: onProgress ? Date.now() : 0,\n                reportProgress: null\n            };\n            context.reportProgress = onProgress ? function(force = false) {\n                const now = Date.now();\n                const nodesElapsed = context.nodes - context.lastReportedNodes;\n                const timeElapsed = now - context.lastReportedAt;\n                if (!force &&\n                    nodesElapsed < PCA_PROGRESS_NODE_INTERVAL &&\n                    timeElapsed < PCA_PROGRESS_TIME_INTERVAL\n                ) return;\n                context.lastReportedNodes = context.nodes;\n                context.lastReportedAt = now;\n                onProgress({\n                    status: 'RUNNING',\n                    kGuard: guard,\n                    depth: context.activeDepth,\n                    nodes: context.nodes,\n                    nodeGuard: context.nodeGuard,\n                    movesCompleted: Math.max(0, context.activeMoveIndex + (force ? 1 : 0)),\n                    totalMoves: initialCandidates,\n                    activeMove: context.activeMove,\n                    activeMoveIndex: context.activeMoveIndex,\n                    activeMoveNodes: context.nodes - context.activeMoveStartNodes,\n                    trace: trace.slice(),\n                    stopReason: 'SEARCHING'\n                });\n            } : null;\n\n            try {\n                for (const k of horizons) {\n                    context.activeDepth = k;\n                    const winningMoves = [];\n\n                    for (let moveIndex = 0; moveIndex < rootMoves.length; moveIndex += 1) {\n                        const move = rootMoves[moveIndex];\n                        context.activeMove = move.san;\n                        context.activeMoveIndex = moveIndex;\n                        context.activeMoveStartNodes = context.nodes;\n                        if (pcaRootMoveForcesMate(fen, move, rootColor, k, context)) {\n                            winningMoves.push(move);\n                        }\n                        if (context.reportProgress) context.reportProgress(true);\n                    }\n",
              label='mate progress context'
          )

          rep(
              "            }\n        }\n\n\n\n        function pcaEvaluationOutcome(game, initialSide) {",
              "            }\n        }\n\n        function pcaAnalyzePosition(fen, kGuard) {\n            return pcaAnalyzePositionCore(fen, kGuard);\n        }\n\n\n        function pcaEvaluationOutcome(game, initialSide) {",
              label='mate wrapper insertion'
          )

          # 4) Pulse snapshots may include the currently observed partial layer.
          pattern = re.compile(r"        function pcaPulseSnapshotMove\(state, kGuard\) \{.*?\n        \}\n\n        function pcaPulseTemporalEntry", re.S)
          m = pattern.search(s)
          if not m:
              raise SystemExit('pulse snapshot function not found')
          replacement = '''        function pcaPulseSnapshotMove(state, kGuard, partial = null) {
            const activePartial = partial || state.partial || null;
            const winPulse = state.winPulse.slice();
            const drawPulse = state.drawPulse.slice();
            const lossPulse = state.lossPulse.slice();
            let temporal = state.temporal.slice();
            let firstPulseDepth = state.firstPulseDepth;
            let lastComputedDepth = state.lastComputedDepth;
            let partialLayer = false;
            let coverageNodes = null;

            if (activePartial && activePartial.local) {
                const depth = activePartial.depth;
                const local = activePartial.local;
                winPulse[depth] = local.wins;
                drawPulse[depth] = local.draws;
                lossPulse[depth] = local.losses;
                if (firstPulseDepth === null && local.wins + local.draws + local.losses > 0) {
                    firstPulseDepth = depth;
                }

                let wins = 0, draws = 0, losses = 0;
                for (let d = 1; d <= depth; d += 1) {
                    wins += winPulse[d];
                    draws += drawPulse[d];
                    losses += lossPulse[d];
                }
                const frontier = local.nextFrontier.length;
                const resolved = wins + draws + losses;
                const total = resolved + frontier;
                const samePairs = pcaChoose2(wins) + pcaChoose2(draws) + pcaChoose2(losses) + pcaChoose2(frontier);
                const entry = {
                    depth,
                    winsAtDepth: winPulse[depth],
                    drawsAtDepth: drawPulse[depth],
                    lossesAtDepth: lossPulse[depth],
                    cumulativeWins: wins,
                    cumulativeDraws: draws,
                    cumulativeLosses: losses,
                    frontier,
                    resolved,
                    resolution: total > 0 ? resolved / total : 0,
                    signedPulse: total > 0 ? (wins - losses) / total : 0,
                    outcomeUncertainty: pcaEvaluationEntropy([wins, draws, losses, frontier], total),
                    outcomeConflicts: pcaChoose2(total) - samePairs,
                    partial: true
                };
                temporal = temporal.filter(item => item.depth < depth).concat([entry]);
                lastComputedDepth = depth;
                partialLayer = true;
                coverageNodes = activePartial.nodes == null ? null : activePartial.nodes;
            }

            const last = temporal.length > 0 ? temporal[temporal.length - 1] : null;
            const wins = last ? last.cumulativeWins : 0;
            const draws = last ? last.cumulativeDraws : 0;
            const losses = last ? last.cumulativeLosses : 0;
            const frontier = last ? last.frontier : 0;
            const resolved = wins + draws + losses;
            const branchesTotal = resolved + frontier;
            const resolution = branchesTotal > 0 ? resolved / branchesTotal : 0;
            const signedPulse = branchesTotal > 0 ? (wins - losses) / branchesTotal : 0;
            const resolvedUncertainty = resolved > 0 ? pcaEvaluationEntropy([wins, draws, losses], resolved) : null;
            return {
                san: state.san, uci: state.uci, depth: lastComputedDepth,
                firstPulseDepth, lastComputedDepth,
                complete: !partialLayer && state.lastComputedDepth === kGuard,
                partial: partialLayer,
                coverageNodes,
                winPulse, drawPulse, lossPulse,
                temporal, branchesTotal, wins, draws, losses, unknown: frontier, frontier, resolved,
                survivalRate: branchesTotal > 0 ? frontier / branchesTotal : 0,
                outcomeUncertainty: last ? last.outcomeUncertainty : 0, resolvedUncertainty,
                outcomeConflicts: last ? last.outcomeConflicts : 0,
                balance: signedPulse, signedPulse, resolution, pcaScore: signedPulse * resolution
            };
        }

        function pcaPulseTemporalEntry'''
          s = s[:m.start()] + replacement + s[m.end():]

          rep(
              "        function pcaPulseProgressPayload(fen, guard, initialSide, rootMoves, states, context, depth, movesCompleted, status, stopReason = null) {\n            return {\n                status, fen, kGuard: guard, side: initialSide, totalMoves: rootMoves.length,\n                nodes: context.nodes, nodeGuard: context.nodeGuard, depth, movesCompleted,\n                moves: states.map(state => pcaPulseSnapshotMove(state, guard)), stopReason\n            };\n        }\n",
              "        function pcaPulseProgressPayload(fen, guard, initialSide, rootMoves, states, context, depth, movesCompleted, status, stopReason = null, activePartial = null) {\n            return {\n                status, fen, kGuard: guard, side: initialSide, totalMoves: rootMoves.length,\n                nodes: context.nodes, nodeGuard: context.nodeGuard, depth, movesCompleted,\n                moves: states.map((state, index) => pcaPulseSnapshotMove(\n                    state,\n                    guard,\n                    activePartial && activePartial.stateIndex === index ? activePartial : null\n                )),\n                stopReason\n            };\n        }\n",
              label='pulse progress payload'
          )

          rep(
              "                temporal: [], firstPulseDepth: null, lastComputedDepth: 0, frontierFens: []\n",
              "                temporal: [], firstPulseDepth: null, lastComputedDepth: 0, frontierFens: [], partial: null\n",
              label='pulse state partial slot'
          )

          pattern = re.compile(r"            function maybeReportPulseProgress\(depth, state, stateIndex, moveStartNodes, layerComplete = false\) \{.*?\n            \}\n\n            let truncated", re.S)
          m = pattern.search(s)
          if not m:
              raise SystemExit('maybeReportPulseProgress not found')
          replacement = '''            function maybeReportPulseProgress(depth, state, stateIndex, moveStartNodes, local = null, layerComplete = false, force = false) {
                if (!onProgress) return;
                const now = Date.now();
                const nodesElapsed = context.nodes - context.lastReportedNodes;
                const timeElapsed = now - context.lastReportedAt;
                if (!force && !layerComplete &&
                    nodesElapsed < PCA_PROGRESS_NODE_INTERVAL &&
                    timeElapsed < PCA_PROGRESS_TIME_INTERVAL
                ) return;

                context.lastReportedNodes = context.nodes;
                context.lastReportedAt = now;
                const activePartial = !layerComplete && local ? {
                    stateIndex,
                    depth,
                    nodes: context.nodes - moveStartNodes,
                    local: {
                        wins: local.wins,
                        draws: local.draws,
                        losses: local.losses,
                        nextFrontier: local.nextFrontier.slice()
                    }
                } : null;
                const snapshot = pcaPulseProgressPayload(
                    fen, guard, initialSide, rootMoves, states, context,
                    depth, movesCompleted, 'RUNNING', null, activePartial
                );
                snapshot.activeMove = state.san;
                snapshot.activeMoveIndex = stateIndex;
                snapshot.activeMoveNodes = context.nodes - moveStartNodes;
                snapshot.layerComplete = layerComplete;
                onProgress(snapshot);
            }

            let truncated'''
          s = s[:m.start()] + replacement + s[m.end():]

          # Report only after the current node has been classified into local W/D/L/frontier.
          rep(
              "                            context.nodes += 1;\n                            maybeReportPulseProgress(depth, state, stateIndex, moveStartNodes);\n                            const outcome = pcaEvaluationOutcome(game, initialSide);\n                            if (outcome === 'WIN') local.wins += 1;\n                            else if (outcome === 'DRAW') local.draws += 1;\n                            else if (outcome === 'LOSS') local.losses += 1;\n                            else local.nextFrontier.push(game.fen());\n",
              "                            context.nodes += 1;\n                            const outcome = pcaEvaluationOutcome(game, initialSide);\n                            if (outcome === 'WIN') local.wins += 1;\n                            else if (outcome === 'DRAW') local.draws += 1;\n                            else if (outcome === 'LOSS') local.losses += 1;\n                            else local.nextFrontier.push(game.fen());\n                            maybeReportPulseProgress(depth, state, stateIndex, moveStartNodes, local);\n",
              label='depth1 incremental pulse'
          )

          rep(
              "                                    context.nodes += 1;\n                                    maybeReportPulseProgress(depth, state, stateIndex, moveStartNodes);\n                                    const outcome = pcaEvaluationOutcome(child, initialSide);\n                                    if (outcome === 'WIN') local.wins += 1;\n                                    else if (outcome === 'DRAW') local.draws += 1;\n                                    else if (outcome === 'LOSS') local.losses += 1;\n                                    else local.nextFrontier.push(child.fen());\n",
              "                                    context.nodes += 1;\n                                    const outcome = pcaEvaluationOutcome(child, initialSide);\n                                    if (outcome === 'WIN') local.wins += 1;\n                                    else if (outcome === 'DRAW') local.draws += 1;\n                                    else if (outcome === 'LOSS') local.losses += 1;\n                                    else local.nextFrontier.push(child.fen());\n                                    maybeReportPulseProgress(depth, state, stateIndex, moveStartNodes, local);\n",
              label='deep incremental pulse'
          )

          rep(
              "                    } catch (error) {\n                        if (error && error.code === 'PCA_EVAL_NODE_GUARD') { truncated = true; break outer; }\n                        throw error;\n                    }\n\n                    state.winPulse[depth] = local.wins; state.drawPulse[depth] = local.draws; state.lossPulse[depth] = local.losses;\n",
              "                    } catch (error) {\n                        if (error && error.code === 'PCA_EVAL_NODE_GUARD') {\n                            state.partial = {\n                                stateIndex,\n                                depth,\n                                nodes: context.nodes - moveStartNodes,\n                                local: {\n                                    wins: local.wins,\n                                    draws: local.draws,\n                                    losses: local.losses,\n                                    nextFrontier: local.nextFrontier.slice()\n                                }\n                            };\n                            maybeReportPulseProgress(depth, state, stateIndex, moveStartNodes, local, false, true);\n                            truncated = true;\n                            break outer;\n                        }\n                        throw error;\n                    }\n\n                    state.partial = null;\n                    state.winPulse[depth] = local.wins; state.drawPulse[depth] = local.draws; state.lossPulse[depth] = local.losses;\n",
              label='truncated partial preservation'
          )

          rep(
              "                    maybeReportPulseProgress(depth, state, stateIndex, moveStartNodes, true);\n",
              "                    maybeReportPulseProgress(depth, state, stateIndex, moveStartNodes, local, true);\n",
              label='layer completion report'
          )

          # 5) Reset/persist user's selected temporal move.
          rep(
              "        function resetPCAEvaluation() {\n            pcaLastEvaluation = null;\n",
              "        function resetPCAEvaluation() {\n            pcaLastEvaluation = null;\n            selectedPulseMoveUci = null;\n",
              label='reset selected temporal move'
          )

          rep(
              "                row.addEventListener('click', () => renderPCAPulseTemporal(move));\n",
              "                row.addEventListener('click', () => {\n                    selectedPulseMoveUci = move.uci;\n                    renderPCAPulseTemporal(move);\n                });\n",
              label='temporal row selection'
          )

          rep(
              "            renderPCAPulseTemporal(moves[0]);\n            refreshPCAEvaluationStockfish();\n",
              "            const selectedMove = moves.find(move => move.uci === selectedPulseMoveUci) || moves[0];\n            if (selectedMove && !selectedPulseMoveUci) selectedPulseMoveUci = selectedMove.uci;\n            renderPCAPulseTemporal(selectedMove);\n            refreshPCAEvaluationStockfish();\n",
              label='persistent temporal rendering'
          )

          # 6) Serialize instrumented mate core into PCA Worker.
          rep(
              "                pcaResultMetrics,\n                pcaAnalyzePosition,\n",
              "                pcaResultMetrics,\n                pcaAnalyzePositionCore,\n                pcaAnalyzePosition,\n",
              label='worker mate core serialization'
          )

          rep(
              "                    const pcaResult = pcaAnalyzePosition(message.fen, message.kGuard);\n",
              "                    const pcaResult = pcaAnalyzePositionCore(message.fen, message.kGuard, {\n                        onProgress: snapshot => {\n                            send('PROGRESS', Object.assign({ phase: 'MATE_SEARCH' }, snapshot));\n                        }\n                    });\n",
              label='worker mate realtime call'
          )

          # Show active move fields during MATE_SEARCH progress too.
          rep(
              "                            movesCompleted: message.movesCompleted,\n                            totalMoves: message.totalMoves,\n                            moves: message.moves || [],\n                            stopReason: 'SEARCHING'\n",
              "                            movesCompleted: message.movesCompleted,\n                            totalMoves: message.totalMoves,\n                            activeMove: message.activeMove,\n                            activeMoveNodes: message.activeMoveNodes,\n                            moves: message.moves || [],\n                            stopReason: 'SEARCHING'\n",
              label='mate active move UI forwarding'
          )

          path.write_text(s, encoding='utf-8')
          print('PCA pulse realtime patch applied successfully')
          PY

      - name: Basic static checks
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              'function pcaAnalyzePositionCore(',
              'function pcaAnalyzePosition(fen, kGuard)',
              'selectedPulseMoveUci',
              'W≤K', 'D≤K', 'L≤K',
              'state.partial = {',
              'activePartial',
              "phase: 'MATE_SEARCH'"
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing expected markers: ' + ', '.join(missing))
          if s.count('id="pcaEvaluationActiveMove"') != 1:
              raise SystemExit('Unexpected duplicate/missing pcaEvaluationActiveMove id')
          print('Static checks passed')
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pca-pulse-hotfix.yml
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Complete PCA pulse realtime metrics"
          git push origin HEAD:main
